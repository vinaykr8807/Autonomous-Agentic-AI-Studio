<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="100%" height="100%" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="660" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="580" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">
    Autonomous Agentic AI System — Architecture &amp; Closed-Loop Control Flow
  </text>
  <text x="580" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">
    FastAPI Backend • Groq LLM (openai/gpt-oss-120b) • Serper Search • Tavily Crawler • SentenceTransformers + FAISS • SQLite • React UI
  </text>

  <!-- 1. User / Frontend Layer -->
  <rect x="35" y="95" width="215" height="225" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="142" y="122" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. CLIENT LAYER</text>
  <rect x="52" y="138" width="180" height="58" rx="7" fill="#0f172a" stroke="#475569"/>
  <text x="142" y="162" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">React Studio Dashboard</text>
  <text x="142" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">Goal Input + Live SSE Stream</text>

  <rect x="52" y="210" width="180" height="44" rx="7" fill="#0f172a" stroke="#475569"/>
  <text x="142" y="230" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">CLI Runner (cli.py)</text>
  <text x="142" y="245" text-anchor="middle" fill="#94a3b8" font-size="10">Batch &amp; Transcript Exporter</text>

  <rect x="52" y="266" width="180" height="40" rx="7" fill="#2e1f0f" stroke="#f59e0b"/>
  <text x="142" y="290" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Fault Injection Controller</text>

  <!-- 2. FastAPI & Orchestrator Core -->
  <rect x="295" y="95" width="525" height="390" rx="12" fill="#151e30" stroke="#6366f1" stroke-width="2"/>
  <text x="557" y="122" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">
    2. FASTAPI BACKEND &amp; AUTONOMOUS AGENT ORCHESTRATOR
  </text>

  <!-- Node A: Planner -->
  <rect x="320" y="142" width="225" height="90" rx="8" fill="url(#blueGrad)" stroke="#60a5fa"/>
  <text x="432" y="166" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">A. Goal Decomposer &amp; Planner</text>
  <text x="432" y="186" text-anchor="middle" fill="#dbeafe" font-size="10.5">Groq API: openai/gpt-oss-120b</text>
  <text x="432" y="204" text-anchor="middle" fill="#bfdbfe" font-size="10">Emits Visible Planning Trace &amp;</text>
  <text x="432" y="219" text-anchor="middle" fill="#bfdbfe" font-size="10">4-Step Tool Sequence JSON</text>

  <!-- Node B: Step Executor -->
  <rect x="320" y="262" width="225" height="95" rx="8" fill="url(#purpleGrad)" stroke="#c084fc"/>
  <text x="432" y="286" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">B. Step-by-Step Tool Executor</text>
  <text x="432" y="306" text-anchor="middle" fill="#ede9fe" font-size="10.5">Validates Schemas &amp; Invokes Tools</text>
  <text x="432" y="324" text-anchor="middle" fill="#ddd6fe" font-size="10">Auto-Indexes Output Chunks into</text>
  <text x="432" y="339" text-anchor="middle" fill="#ddd6fe" font-size="10">FAISS Vector Store</text>

  <!-- Node C: Self-Correction Engine -->
  <rect x="575" y="262" width="225" height="95" rx="8" fill="url(#amberGrad)" stroke="#fbbf24"/>
  <text x="687" y="286" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">C. Self-Correction &amp; Recovery</text>
  <text x="687" y="306" text-anchor="middle" fill="#fef3c7" font-size="10.5">Diagnoses Timeouts / 503 / Empty</text>
  <text x="687" y="324" text-anchor="middle" fill="#fde68a" font-size="10">1. Retry w/ Backoff  2. Query Rewrite</text>
  <text x="687" y="339" text-anchor="middle" fill="#fde68a" font-size="10">3. Cross-Tool Fallback (Serper&#8596;Tavily)</text>

  <!-- Node D: Verifier & Reporter -->
  <rect x="320" y="382" width="480" height="82" rx="8" fill="url(#greenGrad)" stroke="#34d399"/>
  <text x="560" y="406" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">
    D. Self-Evaluator &amp; Structured Report Synthesizer (Groq openai/gpt-oss-120b)
  </text>
  <text x="560" y="426" text-anchor="middle" fill="#d1fae5" font-size="10.5">
    Computes Goal Coverage, FAISS Grounding Score &amp; Plan Adherence Ratio
  </text>
  <text x="560" y="444" text-anchor="middle" fill="#a7f3d0" font-size="10.5">
    Outputs Executive Summary, Key Findings, Citations &amp; "What Agent Did &amp; Why" Audit
  </text>

  <!-- 3. External Tools & Vector Memory Layer -->
  <rect x="860" y="95" width="265" height="390" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="992" y="122" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">3. MULTI-TOOL ECOSYSTEM</text>

  <rect x="880" y="140" width="225" height="68" rx="7" fill="#0f172a" stroke="#38bdf8"/>
  <text x="992" y="163" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Tool 1: serper_web_search</text>
  <text x="992" y="181" text-anchor="middle" fill="#cbd5e1" font-size="10">Serper.dev Google SERP Discovery</text>
  <text x="992" y="196" text-anchor="middle" fill="#94a3b8" font-size="9.5">(+ Live OpenSearch Fallback)</text>

  <rect x="880" y="222" width="225" height="68" rx="7" fill="#0f172a" stroke="#a78bfa"/>
  <text x="992" y="245" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">Tool 2: tavily_web_crawler</text>
  <text x="992" y="263" text-anchor="middle" fill="#cbd5e1" font-size="10">Tavily /extract &amp; Deep /search API</text>
  <text x="992" y="278" text-anchor="middle" fill="#94a3b8" font-size="9.5">Full-Page Clean Text Extraction</text>

  <rect x="880" y="304" width="225" height="78" rx="7" fill="#0f172a" stroke="#34d399"/>
  <text x="992" y="326" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">Tool 3: faiss_rag_memory</text>
  <text x="992" y="344" text-anchor="middle" fill="#cbd5e1" font-size="10">sentence-transformers (all-MiniLM-L6-v2)</text>
  <text x="992" y="359" text-anchor="middle" fill="#94a3b8" font-size="9.5">FAISS IndexFlatIP Cosine Search</text>

  <rect x="880" y="396" width="225" height="68" rx="7" fill="#0f172a" stroke="#fbbf24"/>
  <text x="992" y="419" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Tool 4: calculator_evaluator</text>
  <text x="992" y="437" text-anchor="middle" fill="#cbd5e1" font-size="10">Safe AST Mathematical &amp; Budget</text>
  <text x="992" y="452" text-anchor="middle" fill="#94a3b8" font-size="9.5">Evaluator (CAGR, Mean, Arithmetic)</text>

  <!-- 4. Persistence Layer (SQLite + Transcripts) -->
  <rect x="295" y="515" width="525" height="110" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="557" y="540" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">
    4. PERSISTENCE &amp; AUDIT STORAGE (SQLite + Sample Transcripts)
  </text>
  <rect x="320" y="553" width="225" height="55" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="432" y="576" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="600">SQLite Database (agent_runs.db)</text>
  <text x="432" y="594" text-anchor="middle" fill="#94a3b8" font-size="10">Plans, Tool Calls, Corrections, Reports</text>

  <rect x="575" y="553" width="225" height="55" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="687" y="576" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="600">Exported Run Logs (sample_runs/)</text>
  <text x="687" y="594" text-anchor="middle" fill="#94a3b8" font-size="10">JSON + Markdown Verifiable Artifacts</text>

  <!-- Arrows -->
  <line x1="250" y1="185" x2="318" y2="185" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="432" y1="232" x2="432" y2="260" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- Executor <-> Self-Correction Loop -->
  <path d="M 545 292 L 573 292" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <path d="M 575 328 L 547 328" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <!-- Executor -> Tools -->
  <line x1="800" y1="310" x2="858" y2="310" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- Executor -> Reporter -->
  <line x1="432" y1="357" x2="432" y2="380" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- Reporter -> SQLite -->
  <line x1="557" y1="464" x2="557" y2="513" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
